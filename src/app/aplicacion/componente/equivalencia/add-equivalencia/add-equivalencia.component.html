<form method="POST" [formGroup]="fGeneral">
    <div class="animated fadeIn container-fluid">
        <div class="row">
            <!--/.col-->
            <div class="col-12 col-md-6 pr-md-0">
                <div class="card m-0">
                    <div class="card-header">
                        <strong>Equivalencia de entidad</strong>
                    </div>
                    <div class="card-body">
                        
                        <div class="row">
                            <div class="form-group col-12 col-md-5">
                                <label for="nombre">Nombre</label>
                                <input type="text" class="form-control" id="nombre" name="nombre"
                                    placeholder="Ingrese el nombre que represente a la entidad" formControlName="nombre"
                                    [(ngModel)]="entidadEquivalencia.nombre"
                                    [ngClass]="{'is-invalid': fGeneral.get('nombre').errors && fGeneral.get('nombre').dirty ,'is-valid': !fGeneral.get('nombre').errors}"
                                    required autofocus>
                                <div class="invalid-feedback" *ngIf="fGeneral.get('nombre').hasError('required')">
                                    <small>Campo requerido</small></div>
                            </div>

                            <div class="form-group col-12 col-md-7">
                                <label for="entidad">Entidad</label>
                                <input type="text" class="form-control" id="entidad" name="entidad"
                                    placeholder="Ingrese el nombre de la entidad con su esquema"
                                    formControlName="entidad" [(ngModel)]="entidadEquivalencia.entidad"
                                    autofocus>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-12">
                                <label for="descripcion">Descripción</label>
                                <textarea id="descripcion" name="descripcion" rows="3" class="form-control"
                                    placeholder="Breve descripción de aplicación" formControlName="descripcion"
                                    [(ngModel)]="entidadEquivalencia.descripcion"></textarea>
                            </div>
                        </div>

                        <div class="row mt-3">
                            <div class="form-group col-12">
                                <label for="conexion">Conexión</label>
                                <select class="form-control" id="conexion" formControlName="conexion"
                                    [(ngModel)]="entidadEquivalencia.idConexionJdbc">
                                    <option *ngFor="let param of listaConexiones" value="{{param.id}}">{{param.nombre}}</option>
                                </select>
                            </div>
                        </div>
                        
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-6">
                <tabset>
                    <tab heading="Atributos simples">
                        <div class="card m-0">
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-12">
                                        <div class="table-responsive">
                                            <table class="table table-sm table-borderless">
                                                <thead>
                                                    <tr>
                                                        <th class="text-center"></th>
                                                        <th colspan="2" class="text-center">Origen</th>
                                                        <th colspan="2" class="text-center">Destino</th>
                                                    </tr>
                                                    <tr>
                                                        <th scope="col" width="10%"></th>
                                                        <th scope="col" width="28%" class="text-center">Nombre</th>
                                                        <th scope="col" width="17%" class="text-center">Valor</th>
                                                        <th scope="col" width="28%" class="text-center">Nombre</th>
                                                        <th scope="col" width="17%" class="text-center">Valor</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    <tr>
                                                        <th scope="row" class="text-center">X</th>
                                                        <td>CC</td>
                                                        <td class="text-center">10</td>
                                                        <td><input class="form-control form-control-sm" type="text"></td>
                                                        <td><input class="form-control form-control-sm" type="text"></td>
                                                    </tr>
                                                    <tr>
                                                        <th scope="row" class="text-center">X</th>
                                                        <td>TI</td>
                                                        <td class="text-center">11</td>
                                                        <td><input class="form-control form-control-sm" type="text"></td>
                                                        <td><input class="form-control form-control-sm" type="text"></td>
                                                    </tr>
                                                    <tr>
                                                        <th scope="row" class="text-center">+</th>
                                                        <td><input class="form-control form-control-sm" type="text"></td>
                                                        <td class="text-center"><input class="form-control form-control-sm" type="text"></td>
                                                        <td><input class="form-control form-control-sm" type="text"></td>
                                                        <td><input class="form-control form-control-sm" type="text"></td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </tab>
                </tabset>
            </div>
        </div>
        <!--/.row-->
        <div class="row my-2">
            <div class="col-12"><div class="borde-arriba"></div></div>
            <div class="col-12 text-right py-2">
                <button type="button" class="btn btn-primary pull-right mr-1" [disabled]="fGeneral.invalid"
                    (click)="irRegistar()">
                    Registrar
                </button>
            </div>
        </div>
    </div>
</form>
<app-ventana-modal #alerta></app-ventana-modal>
