<div class="container-fluid" *ngIf="mostrar; else elseBlock">
    <div class="row">
        <div class="form-group col-12">
            <label for="nombre">Nombre equivalencia</label>
            <input type="text" class="form-control" id="nombre" name="nombre"
                placeholder="Ingrese el nombre que represente a la equivalencia de datos" 
                [(ngModel)]="nombreAtributo"
                required autofocus>
                
        </div>
    </div>
    <div class="row">
         <div class="col-12">
            <app-upload-parametro #parametroComponente [tipo]="tipoCarga"></app-upload-parametro>
        </div>
    </div>
</div>
<ng-template #elseBlock>
    <div class="d-flex justify-content-center align-items-center" style="height: 100%;">
        <div class="spinner-grow text-info" style="width: 3rem; height: 3rem;" role="status">
            <span class="sr-only">Cargando...</span>
        </div>
    </div>
</ng-template>
