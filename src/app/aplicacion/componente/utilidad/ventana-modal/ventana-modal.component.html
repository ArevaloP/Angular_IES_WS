

<div bsModal #myModal="bs-modal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="myModalLabel"
    aria-hidden="true" style="top: 30%;">
    <div class="modal-dialog modal-danger" role="document">
        <div class="modal-content">
            <div class="modal-header" style="padding: 0.5rem 0.5rem;">
                <h5 class="modal-title">{{ventana.titulo}}</h5>
                <button type="button" class="close" (click)="myModal.hide()" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <p>{{ventana.mensaje}}</p>
            </div>
            <div class="modal-footer" style="padding: 0.5rem">
                <button type="button" class="btn btn-secondary" (click)="myModal.hide()">{{ventana.msgBotonCancelar}}</button>
                <button id="xyz" type="button" class="btn btn-danger" *ngIf="ventana.botonDelete" (click)="accion()">{{ventana.msgBotonRegistar}}</button>
            </div>
        </div>
    </div>
</div>
