

<div bsModal #dangerModal="bs-modal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="myModalLabel"
    aria-hidden="true" style="top: 30%;">
    <div class="modal-dialog modal-danger" role="document">
        <div class="modal-content">
            <div class="modal-header" style="padding: 0.5rem 0.5rem;">
                <h5 class="modal-title">{{ventana.titulo}}</h5>
                <button type="button" class="close" (click)="dangerModal.hide()" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <p [innerHTML]="ventana.mensaje"></p>
            </div>
            <div class="modal-footer" style="padding: 0.5rem">
                <button type="button" class="btn btn-secondary" (click)="dangerModal.hide()">{{ventana.msgBotonCancelar}}</button>
                <button id="xyz" type="button" class="btn btn-danger" *ngIf="ventana.botonDelete" (click)="accionDanger()">{{ventana.msgBotonRegistar}}</button>
            </div>
        </div>
    </div>
</div>


<div bsModal #successModal="bs-modal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-success" role="document" style="top: 30%;">
      <div class="modal-content">
        <div class="modal-header" style="padding: 0.5rem 0.5rem;">
            <h5 class="modal-title">{{ventana.titulo}}</h5>
          <button type="button" class="close" (click)="successModal.hide()" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
            <p [innerHTML]="ventana.mensaje"></p>
        </div>
        <div class="modal-footer" style="padding: 0.5rem">
          <button type="button" class="btn btn-secondary" (click)="successModal.hide()">Cerrar</button>
          <button type="button" class="btn btn-success"  *ngIf="ventana.botonRegistar" (click)="accionSuccess()">{{ventana.msgBotonRegistar}}</button>
        </div>
      </div><!-- /.modal-content -->
    </div><!-- /.modal-dialog -->
  </div><!-- /.modal -->

  <div bsModal #prontmodal="bs-modal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="myModalLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-success" role="document" style="top: 30%;">
      <div class="modal-content">
        <div class="modal-header" style="padding: 0.5rem 0.5rem;">
          <h5 class="modal-title">{{ventana.titulo}}</h5>
          <button type="button" class="close" (click)="prontmodal.hide()" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label for="url">Ingrese el correo electrónico de usuario</label>
            <input type="email" class="form-control" [(ngModel)]="promtValue" id="promtValue" name="promtValue">
          </div>
        </div>
        <div class="modal-footer" style="padding: 0.5rem">
          <button type="button" class="btn btn-secondary" (click)="prontmodal.hide()">Cerrar</button>
          <button type="button" class="btn btn-success" *ngIf="ventana.botonRegistar"
            (click)="accionPront()">{{ventana.msgBotonRegistar}}</button>
        </div>
      </div><!-- /.modal-content -->
    </div><!-- /.modal-dialog -->
  </div><!-- /.modal -->

  <div bsModal #fileUpload="bs-modal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-primary" role="document" style="top: 30%;">
        <div class="modal-content">
          <div class="modal-header" style="padding: 0.5rem 0.5rem;">
          <h5 class="modal-title">{{ventana.titulo}}</h5>
            <button type="button" class="close" (click)="fileUpload.hide()" aria-label="Close">
              <span aria-hidden="true">&times;</span>
            </button>
          </div>
          <div class="modal-body" >
             <app-xls-parametro #xlsparam ></app-xls-parametro>
          </div>

          <div class="modal-footer" style="padding: 0.5rem">
            <button type="button" class="btn btn-secondary" (click)="fileUpload.hide()">Cerrar</button>
            <button type="button" class="btn btn-primary"   (click)="accionRegistrarParametro(callbackParam)">{{ventana.msgBotonRegistar}}</button>
          </div>
        </div><!-- /.modal-content -->
      </div><!-- /.modal-dialog -->
    </div><!-- /.modal -->



    
  <div bsModal #equivalencia="bs-modal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-primary" role="document" style="top: 30%;">

          <div class="modal-header" style="padding: 0.5rem 0.5rem;">
          <h5 class="modal-title">{{ventana.titulo}}</h5>
            <button type="button" class="close" (click)="equivalencia.hide()" aria-label="Close">
              <span aria-hidden="true">&times;</span>
            </button>
          </div>

          <div class="modal-body">
              <app-xls-equivalencia #xlsEquiva ></app-xls-equivalencia>
          </div>
          <div class="modal-footer" style="padding: 0.5rem">
            <button type="button" class="btn btn-secondary" (click)="equivalencia.hide()">Cerrar</button>
            <button type="button" class="btn btn-primary"   (click)="accionRegistrarEquivalencia(callbackParam)" [disabled]="nombreEquivalencia" >{{ventana.msgBotonRegistar}}</button>
          </div>
        </div><!-- /.modal-content -->
      </div><!-- /.modal-dialog -->
    </div><!-- /.modal -->
