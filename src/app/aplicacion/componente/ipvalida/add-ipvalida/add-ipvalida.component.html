<form method="POST" [formGroup]="fGeneral">
    <div class="animated fadeIn container-fluid">
        <div class="row">
            <!--/.col-->
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <strong>Ip Válida </strong>
                    </div>

                    <div class="card-body">
                        <div class="row">
                            <div class="form-group col-12 col-md-8">
                                <label for="ipValida">Ip Válida</label>
                                <input type="text" class="form-control" id="ipValida" name="ipValida"
                                    placeholder="Ingrese la dirección ip autorizada" formControlName="ipValida"
                                    [(ngModel)]="ipValida.ipValida"
                                    [ngClass]="{'is-invalid': fGeneral.get('ipValida').errors && fGeneral.get('ipValida').dirty ,'is-valid': !fGeneral.get('ipValida').errors}"
                                    required autofocus>
                                <div class="invalid-feedback" *ngIf="fGeneral.get('ipValida').hasError('required')">
                                    <small>Campo requerido</small></div>
                            </div>

                            <div class="form-group col-12 col-md-4">
                                <label for="estado">Estado</label>
                                <select class="form-control" id="estado" formControlName="estado"
                                    [(ngModel)]="ipValida.estado" required>
                                    <option value="ACTIVO">ACTIVO</option>
                                    <option value="INACTIVO">INACTIVO</option>
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="form-group col-12">
                                <label for="llaveOtra">Host</label>
                                <input type="text" class="form-control" id="llaveOtra" name="llaveOtra"
                                    placeholder="Ingrese el host  desde el cual se conecta." formControlName="llaveOtra"
                                    [(ngModel)]="ipValida.llaveOtra"
                                    [ngClass]="{'is-invalid': fGeneral.get('llaveOtra').errors && fGeneral.get('llaveOtra').dirty ,'is-valid': !fGeneral.get('llaveOtra').errors}"
                                    required autofocus>
                                <div class="invalid-feedback" *ngIf="fGeneral.get('llaveOtra').hasError('required')">
                                    <small>Campo requerido</small></div>
                            </div>
                        </div>
                    </div>

                    <div class="card-footer p-1">
                        <button type="button" class="btn btn-primary pull-right mr-1" [disabled]="fGeneral.invalid"
                            (click)="irRegistar()">
                            Registrar
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</form>
<app-ventana-modal #alerta></app-ventana-modal>
