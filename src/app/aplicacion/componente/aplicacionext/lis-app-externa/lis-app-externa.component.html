<div class="animated fadeIn">
    <div class="row">

    <div class="col-sm-6 col-lg-3">
            <div class="card text-white bg-success">
                <div class="card-body pb-0">
                    <div class="btn-group float-right" dropdown>
                        <button type="button" class="btn btn-transparent dropdown-toggle p-0" dropdownToggle>
                            <i class="icon-settings"></i>
                        </button>
                        <div class="dropdown-menu dropdown-menu-right" *dropdownMenu>
                            <a class="dropdown-item" routerLink="/aplicacion/add-appexterna" >Agregar</a>
                        </div>
                    </div>
                    <div class="text-value">AGREGAR</div>
                    <div>- - - - - -</div>
                    <div>- - - - - -</div>
                    <div>- - - - - -</div>
                    <div>- - - - - -</div>
                    <div class="chart-wrapper mt-3 mx-3" style="height:10px;"></div>
                </div>
            </div>
        </div>


        <div class="col-sm-6 col-lg-3" *ngFor="let appVO of listadoAplicacionExterna;">
            <div class="card text-white bg-info">
                <div class="card-body pb-0">
                    <div class="btn-group float-right" dropdown>
                        <button type="button" class="btn btn-transparent dropdown-toggle p-0" dropdownToggle>
                            <i class="icon-settings"></i>
                        </button>
                        <div class="dropdown-menu dropdown-menu-right" *dropdownMenu>
                            <a class="dropdown-item" href="#">Modificar</a>
                            <a class="dropdown-item" href="#">Eliminar</a>
                        </div>
                    </div>
                    <div class="text-value">{{appVO.codigo}}</div>
                    <div>{{appVO.nombre | uppercase}}</div>
                    <div>{{appVO.descripcion}}</div>
                    <div>{{appVO.urlAplicacion}}</div>
                    <div>{{appVO.tipo}}</div>
                    <div class="chart-wrapper mt-3 mx-3" style="height:10px;"></div>
                </div>
            </div>
        </div>
    </div>
</div>
