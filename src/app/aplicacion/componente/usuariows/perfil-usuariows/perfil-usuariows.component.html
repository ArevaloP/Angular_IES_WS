<h4 class="text-center mb-2">{{userWebService.nombre}}</h4>

<div class="row">

    <div class="col-12 col-lg-5 col-xl-3 d-lg-flex align-items-lg-center justify-content-lg-center">
        <div class="form-group text-center mb-0">
            <img [src]="fileAvatar.imgURL||(this.userWebService.imagen||'/assets/img/avatars/no-disponible.png')"
                height="140">
            <figcaption class="figure-caption">{{userWebService.email}}</figcaption>
        </div>

        <div class="progress" style="height: 3px;" *ngIf="fileAvatar.uploadResponse.message">
            <div class="progress-bar" role="progressbar" [style.width.%]="fileAvatar.uploadResponse.message"
                aria-valuenow="25" aria-valuemin="0" aria-valuemax="100"></div>
        </div>


    </div>


    <div class="col-12 col-lg-7 col-xl-9">

        <div class="container">
            <div class="row">
                <div class="col-12 col-xl-10">
                    <div class="form-group">
                        <label for="usuario">Usuario</label>
                        <div class="input-group">
                            <div class="input-group-prepend">
                                <span class="input-group-text"><i class="fa fa-user" aria-hidden="true"></i></span>
                            </div>
                            <input type="text" id="user" name="user" class="form-control"
                                value="{{userWebService.usuario}}" [readonly]="true" #userb>
                            <div class="input-group-append">
                                <span class="input-group-text">
                                    <a (click)="copyInputMessage(userb)" style="cursor:pointer">
                                        <i class="fa fa-clipboard" aria-hidden="true"></i>
                                    </a>
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-12 col-xl-10">

                    <div class="form-group">
                        <label for="usuario">Codigo Autenticación</label>
                        <div class="input-group">
                            <div class="input-group-prepend">
                                <span class="input-group-text"><i class="fa fa-key" aria-hidden="true"></i></span>
                            </div>
                            <input type="text" id="basic" name="basic" class="form-control"
                                autocomplete="current-password" value="{{userWebService.basic}}" [readonly]="true"
                                #basic>
                            <div class="input-group-append">
                                <span class="input-group-text">
                                    <a (click)="copyInputMessage(basic)" style="cursor:pointer">
                                        <i class="fa fa-clipboard" aria-hidden="true"></i>
                                    </a>
                                </span>
                            </div>
                        </div>
                    </div>


                </div>
            </div>

            <div class="row">
                <div class="col-12 col-xl-10">
                    <div class="form-group" *ngIf="userWebService.id">

                        <div class="input-group">
                            <div class="input-group-prepend">
                                <span class="input-group-text"><i class="fa fa-asterisk"></i></span>
                            </div>
                            <input type="password" id="password3" name="password3" class="form-control"
                                autocomplete="current-password" [(ngModel)]="newPassword"
                                placeholder="Ingrese la nueva contraseña para actualizar el registro">
                            <div class="input-group-append">
                                <span class="input-group-text">
                                    <a (click)="cambiarContrasena()" style="cursor:pointer">
                                        <i class="fa fa-floppy-o" aria-hidden="true" style="color: olivedrab;"></i></a>
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </div>



    <app-ventana-modal #alerta></app-ventana-modal>
