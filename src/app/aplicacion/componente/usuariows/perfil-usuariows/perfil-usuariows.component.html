<div class="form-group col-sm-9">
    <h5>{{userWebService.nombre}}</h5>
    <small style="color: royalblue">{{userWebService.email}}</small>
</div>

<div class="row">

    <div class="col-sm-2">
        <div class="form-group text-center">
            <img [src]="fileAvatar.imgURL||(this.userWebService.imagen||'/assets/img/avatars/no-disponible.png')" height="140">
        </div>
       
        <div class="progress" style="height: 3px;" *ngIf="fileAvatar.uploadResponse.message">
            <div class="progress-bar" role="progressbar" [style.width.%]="fileAvatar.uploadResponse.message" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100"></div>
        </div>
    </div>


    <div class="col-sm-9">
        <div class="form-group col-sm-9">
            <label for="usuario">Usuario</label>
            <h5>{{userWebService.usuario}}</h5>
        </div>

        <div class="form-group col-sm-9">
            <label for="usuario">Autenticar</label>
            <p>Basic {{userWebService.password}}</p>
        </div>

    </div>


</div>
