<form method="POST" [formGroup]="fGeneral">
    <div class="animated fadeIn">
        <div class="row">
            <!--/.col-->
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <strong>Parámetros</strong>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="form-group col-12 col-md-6">
                                <label for="aliasColumna">Alias</label>
                                <input type="text" class="form-control" id="aliasColumna" name="aliasColumna"
                                    placeholder="Ingrese el alias para la columna" formControlName="aliasColumna"
                                    [(ngModel)]="parametroServicio.aliasColumna"
                                    [ngClass]="{'is-invalid': fGeneral.get('aliasColumna').errors && fGeneral.get('aliasColumna').dirty ,'is-valid': !fGeneral.get('aliasColumna').errors}"
                                    required autofocus>
                                <div class="invalid-feedback" *ngIf="fGeneral.get('aliasColumna').hasError('required')">
                                    <small>Campo requerido</small></div>
                            </div>

                            <div class="form-group col-12 col-md-6">
                                <label for="parametro">Nombre</label>
                                <input type="text" class="form-control" id="parametro" name="parametro"
                                    placeholder="Ingrese el nombre del parámetro" formControlName="parametro"
                                    [(ngModel)]="parametroServicio.parametro"
                                    [ngClass]="{'is-invalid': fGeneral.get('parametro').errors && fGeneral.get('parametro').dirty ,'is-valid': !fGeneral.get('parametro').errors}"
                                    required autofocus>
                                <div class="invalid-feedback" *ngIf="fGeneral.get('parametro').hasError('required')">
                                    <small>Campo requerido</small></div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="form-group col-12 col-md-6">
                                <label for="tipoDato">Tipo de dato</label>
                                <select class="form-control" id="tipoDato" formControlName="tipoDato" [(ngModel)]="parametroServicio.tipoDato"
                                    required>
                                    <option value="ARRAY">ARRAY</option>
                                    <option value="DATE">DATE</option>
                                    <option value="INTEGER">INTEGER</option>
                                    <option value="NUMERICO">NUMERICO</option>
                                    <option value="OTRO">OTRO</option>
                                    <option value="SMALLINT">SMALLINT</option>
                                    <option value="STRING">STRING</option>
                                </select>
                            </div>

                            <div class="form-group col-12 col-md-6">
                                <label for="longitudFormato">Longitud</label>
                                <input type="text" class="form-control" id="longitudFormato" name="longitudFormato"
                                    placeholder="Ingrese la longitud del parámetro" formControlName="longitudFormato"
                                    [(ngModel)]="parametroServicio.longitudFormato"
                                    [ngClass]="{'is-invalid': fGeneral.get('longitudFormato').errors && fGeneral.get('longitudFormato').dirty ,'is-valid': !fGeneral.get('longitudFormato').errors}"
                                    required autofocus>
                                <div class="invalid-feedback" *ngIf="fGeneral.get('longitudFormato').hasError('required')">
                                    <small>Campo requerido</small></div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="form-group col-12">
                                <label for="descripcion">Descripción</label>
                                <textarea id="descripcion" name="descripcion" rows="3" class="form-control"
                                    placeholder="Breve descripción del parámetro" formControlName="descripcion"
                                    [(ngModel)]="parametroServicio.descripcion"
                                    [ngClass]="{'is-invalid': fGeneral.get('descripcion').errors && fGeneral.get('descripcion').dirty ,'is-valid': !fGeneral.get('descripcion').errors}"
                                    required></textarea>
                                <div class="invalid-feedback" *ngIf="fGeneral.get('descripcion').hasError('required')">
                                    <small>Campo requerido</small>
                                </div>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="form-group col-12 col-md-6">
                                <label for="valorFijo">Valor fijo</label>
                                <input type="text" class="form-control" id="valorFijo" name="valorFijo"
                                    placeholder="Ingrese el valor predeterminado para la columna" formControlName="valorFijo"
                                    [(ngModel)]="parametroServicio.valorFijo"
                                    [ngClass]="{'is-invalid': fGeneral.get('valorFijo').errors && fGeneral.get('valorFijo').dirty ,'is-valid': !fGeneral.get('valorFijo').errors}" >
                            </div>

                            <div class="form-group offset-md-2 col-2 col-md-1">
                                <label for="orden">Orden</label>
                                <input type="text" class="form-control" id="orden" name="orden"
                                    formControlName="orden"
                                    [(ngModel)]="parametroServicio.orden"
                                    [ngClass]="{'is-invalid': fGeneral.get('orden').errors && fGeneral.get('orden').dirty ,'is-valid': !fGeneral.get('orden').errors}"
                                    required autofocus>
                                <div class="invalid-feedback" *ngIf="fGeneral.get('orden').hasError('required')">
                                    <small>Campo requerido</small></div>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer" >
                        <button type="button" class="btn btn-primary pull-right" [disabled]="fGeneral.invalid" (click)="irRegistrar()">
                            Registrar
                        </button>
                    </div>
                </div>
            </div>
            <!--/.col-->

        <!--/.row-->

</form>
