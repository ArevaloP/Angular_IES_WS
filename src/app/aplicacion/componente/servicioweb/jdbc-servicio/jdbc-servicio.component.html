<form method="POST" [formGroup]="fGeneralX">
    <div class="animated fadeIn">
        <div class="row">

            <!--/.col-->
            <div class="col-sm-12">

                <div class="card" style="margin-bottom: 0.1rem;">
                    <div class="card-header" *ngIf="false">
                        <strong>Servicio Web</strong>
                    </div>
                    <div class="card-body pb-0">

                        <div class="form-group">
                            <label for="otraconexion">Cargar conexión existente</label>
                            <select class="form-control" id="otraconexion" name="otraconexion"
                                formControlName="otraconexion" 
                                [(ngModel)]="indexConexion"
                                (ngModelChange)="actualizarCampos($event)">
                                <option value="-1">&nbsp;</option>
                                <option *ngFor="let conexion of listaConexionesExistente; let i=index;" [value]="i">
                                    {{conexion.nombre}}</option>
                            </select>
                        </div>


                        <div class="form-group">

                            <div class="row mb-2">
                                <div class="col-12">
                                    <div class="custom-control custom-checkbox mr-sm-2 d-flex align-items-center">
                                        <input class="custom-control-input" type="checkbox" id="nuevaconexion" name="nuevaconexion"
                                            formControlName="nuevaconexion" [(ngModel)]="isNuevaConexion"
                                            (change)="crearConexionNueva($event)">
                                        <label class="custom-control-label" for="nuevaconexion">Seleccione para crear una nueva conexión </label>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="custom-control custom-checkbox mr-sm-2 d-flex align-items-center">
                                        <label class="custom-control-label" for="limpiarconexion">Seleccione para limpiar la conexión</label>
                                        <input class="custom-control-input" type="checkbox" id="limpiarconexion" name="limpiarconexion"
                                            formControlName="limpiarConexion" [(ngModel)]="isLimpiarConexion"
                                            (change)="limpiarConexionX($event)">
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="form-group col-sm-5">
                                    <label for="codigo">Código</label>
                                    <input type="text" class="form-control" id="codigo" name="codigo"
                                        placeholder="Ingrese el código de la conexión" formControlName="codigo"
                                        [(ngModel)]="jdbcConexion.codigo"
                                        [ngClass]="{'is-invalid': fGeneralX.get('codigo').errors && fGeneralX.get('codigo').dirty ,'is-valid': !fGeneralX.get('codigo').errors}"
                                        [readonly]="isReadOnly" required autofocus>
                                    <div class="invalid-feedback" *ngIf="fGeneralX.get('codigo').hasError('required')">
                                        <small>Campo requerido</small></div>
                                </div>


                                <div class="form-group col-sm-7">
                                    <label for="nombre">Nombre</label>
                                    <input type="text" class="form-control" id="nombre" name="nombre"
                                        placeholder="Ingrese el nombre de la conexión jdbc/academico" formControlName="nombre"
                                        [(ngModel)]="jdbcConexion.nombre"
                                        [ngClass]="{'is-invalid': fGeneralX.get('nombre').errors && fGeneralX.get('nombre').dirty ,'is-valid': !fGeneralX.get('nombre').errors}"
                                        [readonly]="isReadOnly" required autofocus>
                                    <div class="invalid-feedback" *ngIf="fGeneralX.get('nombre').hasError('required')">
                                        <small>Campo requerido</small></div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="form-group col-sm-8">
                                    <label for="serverUrl">Ip servidor</label>
                                    <input type="text" class="form-control" id="serverUrl" name="serverUrl"
                                        placeholder="Ingrese la ip del servidor ejemplo 172.26.2.110" formControlName="serverUrl"
                                        [(ngModel)]="jdbcConexion.serverUrl"
                                        [ngClass]="{'is-invalid': fGeneralX.get('serverUrl').errors && fGeneralX.get('serverUrl').dirty ,'is-valid': !fGeneralX.get('serverUrl').errors}"
                                        [readonly]="isReadOnly" required autofocus>
                                    <div class="invalid-feedback"
                                        *ngIf="fGeneralX.get('serverUrl').hasError('required')">
                                        <small>Campo requerido</small></div>
                                </div>


                                <div class="form-group col-sm-3">
                                    <label for="puerto">Puerto</label>
                                    <input type="text" class="form-control" id="puerto" name="puerto"
                                        placeholder="Ingrese el puerto de la conexion ej 5432" formControlName="puerto"
                                        [(ngModel)]="jdbcConexion.puerto"
                                        [ngClass]="{'is-invalid': fGeneralX.get('puerto').errors && fGeneralX.get('puerto').dirty ,'is-valid': !fGeneralX.get('puerto').errors}"
                                        [readonly]="isReadOnly" required autofocus>
                                    <div class="invalid-feedback" *ngIf="fGeneralX.get('puerto').hasError('required')">
                                        <small>Campo requerido</small></div>
                                </div>
                            </div>


                            <div class="row">

                                <div class="form-group col-sm-5">
                                    <label for="tipoBaseDatos">Motor de base de datos</label>
                                    <select class="form-control" id="tipoBaseDatos" formControlName="tipoBaseDatos"
                                        [(ngModel)]="jdbcConexion.tipoBaseDatos"
                                        [ngClass]="{'is-invalid': fGeneralX.get('tipoBaseDatos').errors && fGeneralX.get('tipoBaseDatos').dirty ,'is-valid': !fGeneralX.get('tipoBaseDatos').errors}"
                                        required [disabled]="isReadOnly">
                                        <option value="oraclethin">ORACLE THIN</option>
                                        <option value="oracle">ORACLE</option>
                                        <option value="postgresql">POSTGRESQL</option>
                                    </select>

                                    <div class="invalid-feedback"
                                        *ngIf="fGeneralX.get('tipoBaseDatos').hasError('required')">
                                        <small>Campo requerido</small>
                                    </div>

                                </div>


                                <div class="form-group col-sm-7">
                                    <label for="serviciosIdAlias">Base de datos</label>
                                    <input type="text" class="form-control" id="serviciosIdAlias"
                                        name="serviciosIdAlias" placeholder="Ingrese el nombre de la base de datos."
                                        formControlName="serviciosIdAlias" [(ngModel)]="jdbcConexion.serviciosIdAlias"
                                        [ngClass]="{'is-invalid': fGeneralX.get('serviciosIdAlias').errors && fGeneralX.get('serviciosIdAlias').dirty ,'is-valid': !fGeneralX.get('serviciosIdAlias').errors}"
                                        [readonly]="isReadOnly" required autofocus>
                                    <div class="invalid-feedback"
                                        *ngIf="fGeneralX.get('serviciosIdAlias').hasError('required')">
                                        <small>Campo requerido</small>
                                    </div>

                                </div>
                            </div>

                            <div class="row ">
                                <div class="form-group col-sm-6">
                                    <label for="userId">Usuario de conexión</label>
                                    <input type="text" class="form-control" id="userId" name="userId"
                                        placeholder="Ingrese el usuario de la conexión." formControlName="userId"
                                        [(ngModel)]="jdbcConexion.userId"
                                        [ngClass]="{'is-invalid': fGeneralX.get('userId').errors && fGeneralX.get('userId').dirty ,'is-valid': !fGeneralX.get('userId').errors}"
                                        [readonly]="isReadOnly" required autofocus>
                                    <div class="invalid-feedback" *ngIf="fGeneralX.get('userId').hasError('required')">
                                        <small>Campo requerido</small></div>
                                </div>


                                <div class="form-group col-sm-6">
                                    <label for="password">Contraseña</label>
                                    <input type="password" class="form-control" id="password" name="password"
                                        placeholder="Ingrese la contraseña de conexión." formControlName="password"
                                        [(ngModel)]="jdbcConexion.password"
                                        [ngClass]="{'is-invalid': fGeneralX.get('password').errors && fGeneralX.get('password').dirty ,'is-valid': !fGeneralX.get('password').errors}"
                                        [readonly]="isReadOnly" required autofocus>
                                    <div class="invalid-feedback" *ngIf="fGeneralX.get('password').hasError('required')">
                                        <small>Campo requerido</small></div>
                                </div>
                            </div>
                        </div>

                    </div>

                    <div class="card-footer p-1" >
                        <button type="button" class="btn btn-ghost-success pull-right"
                            (click)="testearJdbcConexion()">
                            Probar conexión
                        </button>
                    </div>


                </div>

            </div>

        </div>
        <!--/.row-->
    </div>
</form>
<app-ventana-modal #alerta></app-ventana-modal>
